<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mix</title>

    <link rel="stylesheet" href="./styles.css">

    <script type="module" src="js/helpers/navigation.js"></script>
    <script type="module" src="js/mix.js"></script>

    <style>
        .shape-styles { display: none; padding-left: 20px; margin-bottom: 4px; }
        .shape-styles.visible { display: block; }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="canvas-outer">
            <div class="controls-container">
                <button id="btn-toggle-settings" class="control-btn">Settings</button>
                <button id="btn-randomize-objects" class="control-btn">Randomize Objects</button>
                <button id="btn-randomize-color" class="control-btn">Randomize Color</button>
                <button id="btn-pause" class="control-btn">Pause</button>
                <button id="btn-save-png" class="control-btn">Save PNG</button>
                <button id="btn-record-video" class="control-btn">Record Video (16sec)</button>
            </div>

            <div class="canvas-wrapper" id="canvas-container">
                <canvas id="canvas3d"></canvas>

                <div id="settings-panel" class="settings-panel settings-panel--wide hidden">

                    <!-- Two-column: Strokes (left) + Primitives (right) -->
                    <div class="settings-columns">

                        <!-- Left: Strokes + stroke appearance settings -->
                        <div class="settings-column">
                            <div class="settings-header"><h3>Strokes</h3></div>
                            <div class="settings-options">
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-stroke-bezier" checked>
                                    <span class="checkbox-custom"></span>
                                    Bezier
                                </label>
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-stroke-spiral" checked>
                                    <span class="checkbox-custom"></span>
                                    Spiral
                                </label>
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-stroke-zigzag" checked>
                                    <span class="checkbox-custom"></span>
                                    Zigzag
                                </label>
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-stroke-zigzag-bezier" checked>
                                    <span class="checkbox-custom"></span>
                                    Zigzag Bezier
                                </label>
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-stroke-lissajous" checked>
                                    <span class="checkbox-custom"></span>
                                    Lissajous
                                </label>
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-stroke-physics" checked>
                                    <span class="checkbox-custom"></span>
                                    Physics
                                </label>
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-stroke-cube" checked>
                                    <span class="checkbox-custom"></span>
                                    Cube
                                </label>
                            </div>

                            <div class="settings-header" style="margin-top: 16px; border-top: 1px solid rgba(17, 17, 17, 0.15); padding-top: 12px;">
                                <h3>Textures</h3>
                            </div>
                            <div class="settings-options">
                                <label class="settings-label">
                                    <input type="radio" name="rad-texture" value="solid" checked>
                                    <span class="radio-custom"></span>
                                    Solid / Gradient
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-texture" value="dry_brush">
                                    <span class="radio-custom"></span>
                                    Dry Brush
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-texture" value="charcoal">
                                    <span class="radio-custom"></span>
                                    Charcoal
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-texture" value="ink_dotted">
                                    <span class="radio-custom"></span>
                                    Ink Dotted
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-texture" value="hatching">
                                    <span class="radio-custom"></span>
                                    Hatching
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-texture" value="acrylic">
                                    <span class="radio-custom"></span>
                                    Acrylic
                                </label>
                            </div>

                            <div class="settings-header" style="margin-top: 16px; border-top: 1px solid rgba(17, 17, 17, 0.15); padding-top: 12px;">
                                <h3>Noise Mode</h3>
                            </div>
                            <div class="settings-options">
                                <label class="settings-label">
                                    <input type="radio" name="rad-noise-mode" value="auto" checked>
                                    <span class="radio-custom"></span>
                                    Auto (Brush U/V)
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-noise-mode" value="2">
                                    <span class="radio-custom"></span>
                                    Brush U (Longitudinal)
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-noise-mode" value="3">
                                    <span class="radio-custom"></span>
                                    Brush V (Orthogonal)
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-noise-mode" value="1">
                                    <span class="radio-custom"></span>
                                    Raw Noise
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-noise-mode" value="0">
                                    <span class="radio-custom"></span>
                                    Off (Solid Gradient)
                                </label>
                            </div>

                            <div class="settings-header" style="margin-top: 16px; border-top: 1px solid rgba(17, 17, 17, 0.15); padding-top: 12px;">
                                <h3>Cap Style</h3>
                            </div>
                            <div class="settings-options">
                                <label class="settings-label">
                                    <input type="radio" name="rad-cap-style" value="rounded">
                                    <span class="radio-custom"></span>
                                    Rounded
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-cap-style" value="square">
                                    <span class="radio-custom"></span>
                                    Square
                                </label>
                                <label class="settings-label">
                                    <input type="radio" name="rad-cap-style" value="ragged" checked>
                                    <span class="radio-custom"></span>
                                    Ragged
                                </label>
                            </div>
                        </div>

                        <!-- Right: Primitives -->
                        <div class="settings-column">
                            <div class="settings-header"><h3>Primitives</h3></div>
                            <div class="settings-options">

                                <!-- Sphere -->
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-prim-sphere" checked>
                                    <span class="checkbox-custom"></span>
                                    Sphere
                                </label>
                                <div class="shape-styles visible" id="pstyles-sphere">
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="sphere" data-style="0" checked>
                                        <span class="checkbox-custom"></span>
                                        Spiral
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="sphere" data-style="1" checked>
                                        <span class="checkbox-custom"></span>
                                        Horizontal
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="sphere" data-style="2" checked>
                                        <span class="checkbox-custom"></span>
                                        Vertical
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="sphere" data-style="3" checked>
                                        <span class="checkbox-custom"></span>
                                        Mix
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="sphere" data-style="4" checked>
                                        <span class="checkbox-custom"></span>
                                        Gradient
                                    </label>
                                </div>

                                <!-- Cone -->
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-prim-cone" checked>
                                    <span class="checkbox-custom"></span>
                                    Cone
                                </label>
                                <div class="shape-styles visible" id="pstyles-cone">
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cone" data-style="0" checked>
                                        <span class="checkbox-custom"></span>
                                        Spiral
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cone" data-style="1" checked>
                                        <span class="checkbox-custom"></span>
                                        Horizontal
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cone" data-style="2" checked>
                                        <span class="checkbox-custom"></span>
                                        Vertical
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cone" data-style="3" checked>
                                        <span class="checkbox-custom"></span>
                                        Mix
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cone" data-style="4" checked>
                                        <span class="checkbox-custom"></span>
                                        Gradient
                                    </label>
                                </div>

                                <!-- Cylinder -->
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-prim-cylinder" checked>
                                    <span class="checkbox-custom"></span>
                                    Cylinder
                                </label>
                                <div class="shape-styles visible" id="pstyles-cylinder">
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cylinder" data-style="0" checked>
                                        <span class="checkbox-custom"></span>
                                        Spiral
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cylinder" data-style="1" checked>
                                        <span class="checkbox-custom"></span>
                                        Horizontal
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cylinder" data-style="2" checked>
                                        <span class="checkbox-custom"></span>
                                        Vertical
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cylinder" data-style="3" checked>
                                        <span class="checkbox-custom"></span>
                                        Mix
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="cylinder" data-style="4" checked>
                                        <span class="checkbox-custom"></span>
                                        Gradient
                                    </label>
                                </div>

                                <!-- Torus -->
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-prim-torus" checked>
                                    <span class="checkbox-custom"></span>
                                    Torus
                                </label>
                                <div class="shape-styles visible" id="pstyles-torus">
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="torus" data-style="0" checked>
                                        <span class="checkbox-custom"></span>
                                        Spiral
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="torus" data-style="1" checked>
                                        <span class="checkbox-custom"></span>
                                        Horizontal
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="torus" data-style="2" checked>
                                        <span class="checkbox-custom"></span>
                                        Vertical
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="torus" data-style="3" checked>
                                        <span class="checkbox-custom"></span>
                                        Mix
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="torus" data-style="4" checked>
                                        <span class="checkbox-custom"></span>
                                        Gradient
                                    </label>
                                </div>

                                <!-- Pyramid -->
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-prim-pyramid" checked>
                                    <span class="checkbox-custom"></span>
                                    Pyramid
                                </label>
                                <div class="shape-styles visible" id="pstyles-pyramid">
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="pyramid" data-style="0" checked>
                                        <span class="checkbox-custom"></span>
                                        Spiral
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="pyramid" data-style="1" checked>
                                        <span class="checkbox-custom"></span>
                                        Horizontal
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="pyramid" data-style="2" checked>
                                        <span class="checkbox-custom"></span>
                                        Vertical
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="pyramid" data-style="3" checked>
                                        <span class="checkbox-custom"></span>
                                        Mix
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="pyramid" data-style="4" checked>
                                        <span class="checkbox-custom"></span>
                                        Gradient
                                    </label>
                                </div>

                                <!-- Twisted Tube -->
                                <label class="settings-label">
                                    <input type="checkbox" id="chk-prim-twisted-tube" checked>
                                    <span class="checkbox-custom"></span>
                                    Twisted Tube
                                </label>
                                <div class="shape-styles visible" id="pstyles-twisted-tube">
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="twisted-tube" data-style="0" checked>
                                        <span class="checkbox-custom"></span>
                                        Spiral
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="twisted-tube" data-style="1" checked>
                                        <span class="checkbox-custom"></span>
                                        Horizontal
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="twisted-tube" data-style="2" checked>
                                        <span class="checkbox-custom"></span>
                                        Vertical
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="twisted-tube" data-style="3" checked>
                                        <span class="checkbox-custom"></span>
                                        Mix
                                    </label>
                                    <label class="settings-label settings-label--sub">
                                        <input type="checkbox" class="chk-prim-style" data-shape="twisted-tube" data-style="4" checked>
                                        <span class="checkbox-custom"></span>
                                        Gradient
                                    </label>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- Layout controls: count + size range -->
                    <hr class="settings-divider">

                    <div class="settings-header"><h3>Layout</h3></div>

                    <div class="stepper-row">
                        <label for="num-count">Count</label>
                        <input type="number" id="num-count" min="2" max="10" step="1" value="8">
                    </div>

                    <div class="stepper-row">
                        <label for="num-size-min">Min Size</label>
                        <input type="number" id="num-size-min" min="0.3" max="5.0" step="0.1" value="3.0">
                    </div>

                    <div class="stepper-row">
                        <label for="num-size-max">Max Size</label>
                        <input type="number" id="num-size-max" min="0.3" max="5.0" step="0.1" value="5.0">
                    </div>

                </div>
            </div>
        </div>
    </main>
</body>
</html>
